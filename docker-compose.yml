services:
  casino-bot:
    build: .
    container_name: bungo-casino
    restart: unless-stopped
    env_file: /home/will/docker-data/bungo-casino/.env
    volumes:
      # Persist the database
      - /home/will/docker-data/bungo-casino/data:/data
    environment:
      - DATABASE_PATH=/data/casino.db
